  <rect x="104" y="42" width="12" height="3" rx="1.5" fill="white" opacity="0.6"/>
  <rect x="100" y="52" width="16" height="3" rx="1.5" fill="white" opacity="0.6"/>

  <!-- Plus symbol -->
  <circle cx="106" cy="90" r="14" fill="#10b981"/>
